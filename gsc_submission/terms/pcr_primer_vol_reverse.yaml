# Answers for the GSC "MIxS New Term Request Template" (#93).
# Review issue: FAIR-eDNA/FAIRe-GSC-TDWG-term-review#211
existing_term_check: New term – no similar MIxS term found
justification: >-
  The primer volume per reaction, together with the primer concentration and the
  reaction volume (amp_rxn_vol), gives the primer concentration in the
  reaction, which affects PCR efficiency and specificity (MIQE). Recording it lets
  users compare and repeat PCR protocols.
