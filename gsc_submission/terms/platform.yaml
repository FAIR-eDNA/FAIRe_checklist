# Answers for the GSC "MIxS New Term Request Template" (#93).
# Review issue: FAIR-eDNA/FAIRe-GSC-TDWG-term-review#219
existing_term_check: New term – similar MIxS term exists (explain why it doesn't fit)
related_mixs_terms: seq_meth (MIXS:0000050)
justification: >-
  seq_meth records the sequencing instrument model. platform records the sequencing
  technology (e.g. ILLUMINA, OXFORD_NANOPORE), which users filter and compare by
  without having to parse instrument names. The values are the INSDC platform list,
  which sequence archive submissions already use.
comments: >-
  The values follow the INSDC (ENA/SRA) platform list. GenEpiO has an equivalent data
  field, sequencing platform (GENEPIO:0100473), and platform terms for some of the
  values (e.g. Illumina platform, GENEPIO:0001923), but not yet all (e.g. none for
  Oxford Nanopore or Element). FAIRe will use ontology terms once they cover the list.
submitter_questions: >-
  seq_meth is titled "sequencing method" but records the sequencing machine. Could
  the GSC review its name and description?
