# Answers for the GSC "MIxS New Term Request Template" (#93).
# Review issue: FAIR-eDNA/FAIRe-GSC-TDWG-term-review#295
existing_term_check: New term – no similar MIxS term found
justification: >-
  The taxa a study aims to detect can be narrower than what the assay amplifies
  (e.g. an assay for all chordates used to survey sharks and rays), and users need
  both to interpret results. It pairs with targetTaxonomicAssay.
submitter_questions: >-
  This is based on Humboldt's eco:targetTaxonomicScope ("The taxonomic group(s)
  targeted for sampling during the dwc:Event"). Could MIxS reuse the Humboldt term,
  or should it use FAIRe's definition (targeted in the study)?
