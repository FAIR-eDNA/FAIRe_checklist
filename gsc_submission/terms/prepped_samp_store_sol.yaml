# Answers for the GSC "MIxS New Term Request Template" (#93).
# Review issue: FAIR-eDNA/FAIRe-GSC-TDWG-term-review#230
existing_term_check: New term – similar MIxS term exists (explain why it doesn't fit)
related_mixs_terms: samp_store_sol (MIXS:0001317)
justification: >-
  eDNA samples are usually stored twice: the environmental sample (e.g. water) before
  it is processed, and the processed sample (e.g. a filter) before DNA extraction.
  Both storage steps affect DNA degradation, but samp_store_sol can hold only one.
  This term records the processed sample's storage solution; samp_store_sol keeps the
  environmental sample's.
