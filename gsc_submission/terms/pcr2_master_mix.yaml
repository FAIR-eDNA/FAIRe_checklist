# Answers for the GSC "MIxS New Term Request Template" (#93).
# Review issue: FAIR-eDNA/FAIRe-GSC-TDWG-term-review#177
existing_term_check: New term – similar MIxS term exists (explain why it doesn't fit)
related_mixs_terms: pcr_cond (MIXS:0000049); lib_polymerase (MIXS:0001390)
justification: >-
  In two-step metabarcoding PCR (barcoding_pcr_appr), a second PCR adds indexes and
  adapters, often with a different master mix from the first PCR. This term records
  the second PCR's master mix, alongside the first-PCR term master_mix. MIxS's
  pcr_cond covers all reaction conditions and components in one field, and
  lib_polymerase records only the polymerase.
comments: >-
  Replaces FAIRe v1.0's pcr2_commercial_mm and pcr2_custom_mm, which the FAIRe
  working group merged.
