# Answers for the GSC "MIxS New Term Request Template" (#93).
# Review issue: FAIR-eDNA/FAIRe-GSC-TDWG-term-review#339
existing_term_check: New term – no similar MIxS term found
justification: >-
  eDNA results report the taxon assigned to each sequence (OTU/ASV), often only to
  genus or family when reference databases are incomplete, so the rank of the assigned
  name is needed to interpret it. MIxS has no term for it; host_infra_spec_rank covers
  only host ranks below subspecies.
comments: >-
  Values are the 73 ranks of the Taxonomic Rank Vocabulary (TAXRANK:0000000); the
  FAIRe working group chose an existing ontology over its own list. Other ranks can be
  given as other: <rank>.
submitter_questions: >-
  This is Darwin Core's taxonRank, with its values restricted to TAXRANK (Darwin Core
  recommends a controlled vocabulary but doesn't name one). Could MIxS reuse
  dwc:taxonRank directly, and keep the TAXRANK list?
