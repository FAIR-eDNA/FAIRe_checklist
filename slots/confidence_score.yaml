name: confidence_score
title: taxonomic assignment confidence score
description: >-
  Confidence score for the taxonomic assignment, such as from bootstrapping.
  If multiple species were assigned to one ASV/OTU, a range can be entered separated
  by "-" (e.g., 0.996-0.998).
in_subset:
  - OTU/ASV
annotations:
  data_type: taxaRaw | taxaFinal
  requirement_level: Recommended
  requirement_level_code: R
slot_uri: faire:0000036
range: string
required: false
recommended: true
examples:
- value: '0.997'
  description: null
