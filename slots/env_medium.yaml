name: env_medium
title: environmental medium
local_names:
  tdwg-naming-conventions: environmentalMedium
  gsc-naming-conventions: env_medium
description: >-
  Environmental material or materials (pipe separated) immediately surrounded your sample prior to sampling. Select
  from ENVO's environmental material class (entity/ continuant/ independent continuant/ material entity/ environmental material):
  http://purl.obolibrary.org/obo/ENVO_00010483. Examples include: soil [ENVO:00001998], marine sediment [ENVO:03000033], air
  [ENVO:00002005], sea water [ENVO:00002149], fresh water [ENVO:00002011], tap water [ENVO:00003096], fecal material [ENVO:00002003],
  digestive tract environment [ENVO:2100002], intestine environment [ENVO:2100002], planktonic material [ENVO:01000063].
