name: probe_seq
title: probe sequence
local_names:
  tdwg-naming-conventions: probeSequence
  gsc-naming-conventions: probe_seq
description: >-
  If applicable, probe sequence in the 5' to 3' direction.
  Bases are uppercase IUPAC nucleotide codes, with I for inosine; modifications are
  written as slash-delimited supplier codes such as /C3/ (see the
  ModifiedOligoSequence type).
  Reporter and quencher names may still be recorded in probeReporter and
  probeQuencher.
in_subset:
  - PCR
annotations:
  data_type: projectMetadata
  requirement_level: Highly recommended
  requirement_level_code: HR
slot_uri: faire:0000201
range: ModifiedOligoSequence
required: false
recommended: true
examples:
- value: CTTGTTTGTTTGATCAATTC
  description: null
