name: probeQuencher
description: >-
  Type of quencher used. The quencher molecule quenches the fluorescence emitted by the fluorophore when excited
  by the cycler's light source As long as fluorophore and the quencher are in proximity, quenching inhibits any fluorescence
  signals.
