name: tax_assign_conf_score
aliases:
  - confidence_score
title: taxonomic assignment confidence score
local_names:
  tdwg-naming-conventions: taxonomicAssignmentConfidenceScore
  gsc-naming-conventions: tax_assign_conf
description: >-
  Numerical confidence, probability, or support value assigned to a taxonomic
  identification. Interpretation and scale of this value depend directly on the
  categorization reported in tax_assign_cat (e.g., sequence similarity, sequence
  composition, probabilistic) and the computational pipeline recorded in
  otu_seq_comp_appr.
comments:
  - Named confidence_score in FAIRe v1.0 (#150).
