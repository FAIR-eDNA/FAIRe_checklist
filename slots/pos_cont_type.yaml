name: pos_cont_type
title: positive control type
description: >-
  A positive control type used in an investigation. See Table 2 in Klymus
  et al. 2024 (DOI: 10.3897/mbmg.8.128689) for the description of each control type,
  how and why it's created. For example, PCR positive is a introduced target material
  to monitor for PCR success, including moch community samples. Provide further details
  (e.g., synthetic DNA) where applicable.
