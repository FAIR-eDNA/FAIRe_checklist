name: size_frac_up
title: size-fraction upper threshold
local_names:
  tdwg-naming-conventions: sizeFractionUp
  gsc-naming-conventions: size_frac_up
description: >-
  Refers to the mesh/pore size used to pre-filter/pre-sort the sample.
  Materials larger than the size threshold are excluded from the sample.
comments:
  - Named size_frac_low in FAIRe v1.0, which copied MIxS's swapped definitions; the slot
    and its values (the pre-filter size) are unchanged, only the name is corrected (#26).
  - Follows the corrected definitions proposed in GenomicsStandardsConsortium/mixs#566
    and #1414; MIxS's current definitions of size_frac_low and size_frac_up are swapped.
in_subset:
