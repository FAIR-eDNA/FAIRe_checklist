description: >-
  If commercial master mix was used, provide the product name, brand, manufacture,
  catalogue number and/or supplier URL to the product page. If custom master mix was
  used, provide the composition, including the names, volumes and concentrations of
  additives (i.e., salts, buffers, enzyme and other components).
