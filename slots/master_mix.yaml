examples:
- value: Luna Universal qPCR Master Mix, New England Biolabs
  description: commercial master mix
- value: 'Each PCR reaction comprised: 1 x Taq Gold buffer (Applied Biosystems [ABI],
    USA), 2 nM MgCl2 (ABI, USA), 0.4 mg/mL BSA (Fisher Biotec, Australia), 0.25 mM
    dNTPs (Astral Scientific, Australia), 0.4 µM each of forward and reverse primers
    (Integrated DNA Technologies, Australia), 0.6 µL of 1/10,000 SYBR Green dye (Life
    Technologies, USA), 1 U of Taq polymerase Gold (ABI, USA), 2 µL of DNA, and made
    up to 25 µL with PCR grade water'
  description: custom master mix
