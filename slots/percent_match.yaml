name: percent_match
title: percent identity to reference sequence
description: >-
  The percentage of sequence identity between a query sequence obtained
  from eDNA and a reference sequence in a database. If multiple species were assigned
  to one ASV/OTU, a range can be entered separated by "-" (e.g., 98.7-99.2).
in_subset:
  - OTU/ASV
annotations:
  data_type: taxaRaw | taxaFinal
  requirement_level: Recommended
  requirement_level_code: R
slot_uri: __TODO_ADD_SLOT_URI__
range: string
unit:
  ucum_code: '%'
  descriptive_name: percent
required: false
recommended: true
examples:
- value: '99.8'
  description: null
