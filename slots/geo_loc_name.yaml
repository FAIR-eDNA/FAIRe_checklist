name: geo_loc_name
title: geographic location (country and/or sea,region)
local_names:
  tdwg-naming-conventions: geographicLocationName
  gsc-naming-conventions: geo_loc_name
description: >-
  The geographical origin of the sample as defined by the country or sea
  name followed by regions and localities. Country or sea names should be chosen from
  the INSDC Geographic Location Name List INSDC country list (http://insdc.org/country.html).
  Fixed format following <country or sea names>:<region>,<locality>. E.g., "USA: Maryland,
  Bethesda" , "Atlantic Ocean:Charlie Gibbs Fracture Zone".
in_subset:
  - Sample collection
annotations:
  data_type: sampleMetadata
  requirement_level: Mandatory
  requirement_level_code: M
  modifications_made: description
slot_uri: faire:0000078
range: string
required: true
recommended: false
examples:
- value: 'USA: Maryland, Bethesda'
  description: null
source: mixs:0000010
