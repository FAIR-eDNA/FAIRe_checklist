name: size_frac_low
title: size-fraction lower threshold
local_names:
  tdwg-naming-conventions: sizeFractionLow
  gsc-naming-conventions: size_frac_low
description: >-
  Refers to the mesh/pore size used to retain the sample. Materials smaller
  than the size threshold are excluded from the sample.
comments:
  - Named size_frac in FAIRe v1.0 ("Filtering pore size used in sample preparation"); the
    slot and its values (the filter pore size) are unchanged. The name size_frac_low meant
    the pre-filter size in v1.0; that slot is now size_frac_up (#26).
  - Follows the corrected definitions proposed in GenomicsStandardsConsortium/mixs#566
    and #1414; MIxS's current definitions of size_frac_low and size_frac_up are swapped.
in_subset:
  - Sample preparation
annotations:
  data_type: sampleMetadata
  requirement_level: Highly recommended
  requirement_level_code: HR
  sample_type_specificity: Water | Air
  modifications_made: description | field_type
