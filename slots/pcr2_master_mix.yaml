name: pcr2_master_mix
title: second PCR master mix
aliases:
  - pcr2_commercial_mm
  - pcr2_custom_mm
local_names:
  tdwg-naming-conventions: secondPCRMasterMix
  gsc-naming-conventions: pcr2_master_mix
description: >-
  (If barcoding_pcr_appr = "two-step PCR") If commercial master mix was used, provide
  the product name, brand, manufacture, catalogue number and/or supplier URL to the
  product page. If custom master mix was used, provide the composition, including the
  names, volumes and concentrations of additives (i.e., salts, buffers, enzyme and
  other components), in the second step PCR.
comments:
  - Replaces pcr2_commercial_mm and pcr2_custom_mm from FAIRe v1.0 (#42).
in_subset:
  - Library preparation sequencing
annotations:
  data_type: projectMetadata
  requirement_level: Recommended
  requirement_level_code: R
slot_uri: faire:0000321
range: string
required: false
recommended: true
examples:
- value: Luna Universal qPCR Master Mix, New England Biolabs
  description: commercial master mix
- value: 'Each PCR reaction comprised: 1 x Taq Gold buffer (Applied Biosystems [ABI],
    USA), 2 nM MgCl2 (ABI, USA), 0.4 mg/mL BSA (Fisher Biotec, Australia), 0.25 mM
    dNTPs (Astral Scientific, Australia), 0.4 µM each of forward and reverse primers
    (Integrated DNA Technologies, Australia), 0.6 µL of 1/10,000 SYBR Green dye (Life
    Technologies, USA), 1 U of Taq polymerase Gold (ABI, USA), 2 µL of DNA, and made
    up to 25 µL with PCR grade water'
  description: custom master mix
