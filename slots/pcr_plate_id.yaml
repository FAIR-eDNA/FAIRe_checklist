name: pcr_plate_id
title: PCR plate ID
description: >-
  PCR plate ID. This identifier is particularly crucial when location-specific standard
  curves are employed for targeted assay detections, as it ensures a linkage between the
  standards and the corresponding eDNA samples. If two-step PCR was applied, report the
  second PCR under the corresponding pcr2_* term.
