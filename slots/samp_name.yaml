name: samp_name
title: sample name
local_names:
  tdwg-naming-conventions: sampleName
  gsc-naming-conventions: samp_name
description: >-
  A local identifier or name that for the material sample used for extracting nucleic
  acids, and subsequent sequencing. It can refer either to the original material
  collected or to any derived sub-samples. It can have any format, but we suggest that
  you make it concise, unique and consistent within your lab, and as informative as
  possible. INSDC requires every sample name from a single Submitter to be unique. Use
  of a globally unique identifier for the field source_mat_id is recommended in
  addition to sample_name.
in_subset:
  - Sample information
annotations:
  data_type: sampleMetadata | ampData | stdData | experimentRunMetadata
  requirement_level: Mandatory
  requirement_level_code: M
slot_uri: mixs:0001107
range: string
required: true
recommended: false
examples:
- value: S01_1
  description: null
source: mixs:0001107
exact_mappings:
