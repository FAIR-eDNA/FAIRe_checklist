name: sample_composed_of
title: sample composed of
description: >-
  This term contains a list of samp_name values that represent the original
  samples combined to form the current sample. For example, if environmental samples
  "S01" and "S02" were pooled into a single sample "S03" at any stage (e.g., before
  or after DNA extraction), then the value for sample_composed_of in "S03" would be
  "S01 | S02".
in_subset:
  - Sample relations
annotations:
  data_type: sampleMetadata
  requirement_level: Optional
  requirement_level_code: O
slot_uri: faire:0000227
range: string
multivalued: true
required: false
recommended: false
examples:
- value: 'S01 | S02'
  description: null
