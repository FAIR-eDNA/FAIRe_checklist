name: PR checks

# The checks in VALIDATION_RULES.md (#21, #48), on a fresh build of schema.yaml. Nothing is
# committed here. On dev, schema.yaml is rebuilt and committed by build-schema.yml (which also
# checks every push to dev). Into and on main, the committed schema.yaml must equal a fresh
# build (--strict-build): main gets it from dev and is never rebuilt.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml linkml==1.10.0 openpyxl==3.1.5 pandas

      - name: Run checks
        run: python doc_gen_scripts/check_pr.py ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && '--strict-build' || '' }}

      # The Excel files must still build from this change (#147). They are built into build/
      # and not kept; build-schema.yml commits them to excel/ after the merge into dev.
      - name: Build the Excel files
        run: |
          python doc_gen_scripts/build_schema.py
          python doc_gen_scripts/generate_checklist_excel.py --out-dir build
          python doc_gen_scripts/generate_FULLtemplate_excel.py --out-dir build
