    permissible_values:
      'true':
        meaning: schema:True
      'TRUE':
        meaning: schema:True
      '1':
        meaning: schema:True
      'yes':
        meaning: schema:True
      'YES':
        meaning: schema:True
      'false':
        meaning: schema:False
      'FALSE':
        meaning: schema:False
      '0':
        meaning: schema:False
      'no':
        meaning: schema:False
      'NO':
